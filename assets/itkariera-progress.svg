<svg xmlns="http://www.w3.org/2000/svg" width="720" height="64" viewBox="0 0 720 64">
<style>
.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.f{animation:fill 2.2s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:0 0;transform:scaleX(0)}
.n{opacity:0;animation:in .6s 1.8s forwards}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes in{to{opacity:1}}
</style>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2EA043"/><stop offset=".5" stop-color="#1F6FEB"/><stop offset="1" stop-color="#8957E5"/></linearGradient></defs>
<text class="t" x="0" y="18" font-size="15" font-weight="600" fill="#8b949e">MODULES COMPLETED</text>
<text class="t n" x="720" y="18" font-size="15" font-weight="700" fill="#3fb950" text-anchor="end">8 / 8 · 100% ✓</text>
<rect x="0" y="32" width="720" height="20" rx="10" fill="#8b949e" opacity=".2"/>
<g transform="translate(0 32)"><rect class="f" x="0" y="0" width="720" height="20" rx="10" fill="url(#g)"/></g>
</svg>
