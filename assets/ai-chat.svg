<style>.t{font-family:'Segoe UI',Helvetica,Arial,sans-serif}@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}.d{animation:dot 1.2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.live{animation:pulse 1.6s infinite}@keyframes k0{0%,3.75%{opacity:0;transform:translateY(10px)}5.94%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m0{opacity:0;animation:k0 16.0s infinite}@keyframes k1{0%,12.50%{opacity:0}14.69%,21.25%{opacity:1}21.56%,100%{opacity:0}}.m1{opacity:0;animation:k1 16.0s infinite}@keyframes k2{0%,21.25%{opacity:0;transform:translateY(10px)}23.44%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m2{opacity:0;animation:k2 16.0s infinite}@keyframes k3{0%,35.00%{opacity:0;transform:translateY(10px)}37.19%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m3{opacity:0;animation:k3 16.0s infinite}@keyframes k4{0%,42.50%{opacity:0;transform:translateY(10px)}44.69%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m4{opacity:0;animation:k4 16.0s infinite}@keyframes k5{0%,48.75%{opacity:0;transform:translateY(10px)}50.94%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m5{opacity:0;animation:k5 16.0s infinite}@keyframes k6{0%,55.00%{opacity:0}57.19%,62.50%{opacity:1}62.81%,100%{opacity:0}}.m6{opacity:0;animation:k6 16.0s infinite}@keyframes k7{0%,62.50%{opacity:0;transform:translateY(10px)}64.69%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}.m7{opacity:0;animation:k7 16.0s infinite}</style>
