<g class="m0"><rect x="242" y="110" width="294" height="64" rx="18" fill="url(#ub)"/><text class="t" x="258" y="138" font-size="15" fill="#ffffff">Hello! Do you have a double room</text><text class="t" x="258" y="159" font-size="15" fill="#ffffff">free for 12–14 October?</text></g><g class="m1"><rect x="24" y="188" width="74" height="38" rx="19" fill="#21262d"/><circle class="d" style="animation-delay:0.0s" cx="46" cy="207" r="5" fill="#8b949e"/><circle class="d" style="animation-delay:0.2s" cx="61" cy="207" r="5" fill="#8b949e"/><circle class="d" style="animation-delay:0.4s" cx="76" cy="207" r="5" fill="#8b949e"/></g><g class="m2"><rect x="24" y="188" width="335" height="85" rx="18" fill="#21262d"/><text class="t" x="40" y="216" font-size="15" fill="#e6edf3">Hello! Yes, we have a sea-view double</text><text class="t" x="40" y="237" font-size="15" fill="#e6edf3">room for those dates. Would you like</text><text class="t" x="40" y="258" font-size="15" fill="#e6edf3">me to reserve it for you?</text></g><g class="m3"><rect x="307" y="287" width="229" height="43" rx="18" fill="url(#ub)"/><text class="t" x="323" y="315" font-size="15" fill="#ffffff">Yes, please. Two adults.</text></g><g class="m4"><rect x="118" y="344" width="325" height="30" rx="15" fill="#0d2a1a" stroke="#2EA043" stroke-opacity=".6"/><text class="t" x="280.0" y="364" font-size="13" fill="#3fb950" text-anchor="middle">📅  Availability checked in the calendar</text></g><g class="m5"><rect x="144" y="386" width="273" height="30" rx="15" fill="#0d2a1a" stroke="#2EA043" stroke-opacity=".6"/><text class="t" x="280.0" y="406" font-size="13" fill="#3fb950" text-anchor="middle">📨  Booking sent for confirmation</text></g><g class="m6"><rect x="24" y="428" width="74" height="38" rx="19" fill="#21262d"/><circle class="d" style="animation-delay:0.0s" cx="46" cy="447" r="5" fill="#8b949e"/><circle class="d" style="animation-delay:0.2s" cx="61" cy="447" r="5" fill="#8b949e"/><circle class="d" style="animation-delay:0.4s" cx="76" cy="447" r="5" fill="#8b949e"/></g><g class="m7"><rect x="24" y="428" width="335" height="64" rx="18" fill="#21262d"/><text class="t" x="40" y="456" font-size="15" fill="#e6edf3">Done. Reception will confirm the</text><text class="t" x="40" y="477" font-size="15" fill="#e6edf3">booking by email within 15 minutes. ✅</text></g>
